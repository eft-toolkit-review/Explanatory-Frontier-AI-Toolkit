# Parameter registry (appendix Table A13), machine-readable.
# status: suggested  -> a proposal in the Stage-1 appendix, not yet frozen
#         frozen     -> written to the lock record (tools/lock.py) before the stage named in fixed_before
# Nothing in this file is frozen in the Stage-1 artifact. Values marked "suggested"
# may be changed by the team until they are locked; every later change goes to deviations.md.
registry_version: 0.1-stage1
entries:
- id: evaluation_share
  parameter: Evaluation share
  role: Untouched set E
  value: 20% of CEOs, stratified on T quintile, seeded
  fixed_before: Any model fitting
  status: suggested
- id: outer_folds
  parameter: Outer folds
  role: Cross-fitting
  value: 5, stratified on T quintile
  fixed_before: Any model fitting
  status: suggested
- id: gmfn_search
  parameter: GMFN search
  role: Hyperparameters
  value: 30 random configurations; 20% inner validation; patience 10; at most 100 epochs
  fixed_before: Training
  status: suggested
- id: evaluation_mode
  parameter: Evaluation mode
  role: Held-out evaluation
  value: 'Mode K (K-fold cross-fitting) for small samples or when every case needs an out-of-sample estimate;
    Mode S (single split) otherwise. Pilot: Mode S, 609/204/203'
  fixed_before: Any model fitting
  status: suggested
- id: search_log
  parameter: Search log
  role: Hyperparameters
  value: every configuration tried and its validation score are logged
  fixed_before: Training
  status: suggested
- id: training_seeds
  parameter: Training seeds
  role: Stability
  value: at least 5; spread of the metrics reported
  fixed_before: Training
  status: suggested
- id: discriminant_margin
  parameter: Discriminant margin
  role: Measurement
  value: correlation with the trustworthiness rating exceeds that with each rival rating by at least 0.10
  fixed_before: Training
  status: suggested
- id: specificity_margin
  parameter: Specificity margin
  role: Experiment
  value: effect on trustworthiness exceeds the effect on each rival rating by more than δ
  fixed_before: Registration
  status: suggested
- id: validity_gate
  parameter: Validity gate
  role: Measurement
  value: r >= 0.5 * r_max; lower bound of Delta R^2 > 0
  fixed_before: Training
  status: suggested
- id: transcripts
  parameter: Transcripts
  role: Language stream
  value: Whisper large-v3; Amazon as sensitivity
  fixed_before: Profile
  status: suggested
- id: visual_features
  parameter: Visual features
  role: Face stream
  value: OpenFace 3.0; emotion output excluded
  fixed_before: Profile
  status: suggested
- id: profile_variance
  parameter: Profile variance
  role: z
  value: 90% retained, at most 50 components
  fixed_before: Profile
  status: suggested
- id: residual_map
  parameter: Residual map
  role: Residualization
  value: Ridge on a natural cubic spline of T_hat, 4 df; lambda by 5-fold CV
  fixed_before: Profile
  status: suggested
- id: leakage_probe
  parameter: Leakage probe
  role: Audit
  value: Gradient boosting, depth 3, 200 trees, rate 0.05; target T_hat
  fixed_before: Leakage test
  status: suggested
- id: leakage_bound
  parameter: Leakage bound
  role: epsilon
  value: 0.05, or the null 95th percentile if larger
  fixed_before: Leakage test
  status: suggested
- id: projection_rounds
  parameter: Projection rounds
  role: Revision
  value: At most 3; stop if retained variance falls below 70%
  fixed_before: Leakage test
  status: suggested
- id: structure_space
  parameter: Structure space
  role: m_c
  value: 10 principal components
  fixed_before: Structure discovery
  status: suggested
- id: hdbscan
  parameter: HDBSCAN
  role: Diagnostic
  value: Minimum cluster size 30; minimum samples 10
  fixed_before: Structure discovery
  status: suggested
- id: mixture
  parameter: Mixture
  role: Representation
  value: Full covariance; regularization 1e-3; K <= 8; 20 starts; minimum expected size 30
  fixed_before: Structure discovery
  status: suggested
- id: k_criterion
  parameter: K criterion
  role: Selection of K*
  value: ICL (BIC and held-out likelihood reported)
  fixed_before: Structure discovery
  status: suggested
- id: bootstrap
  parameter: Bootstrap
  role: Stability
  value: B = 500; maximum Jaccard matching
  fixed_before: Stability
  status: suggested
- id: stability_threshold
  parameter: Stability threshold
  role: tau
  value: 0.75; dissolved at 0.5
  fixed_before: Stability
  status: suggested
- id: adjudication
  parameter: Adjudication
  role: Configurations
  value: Two independent coders; third resolves; no language model
  fixed_before: Fingerprints
  status: suggested
- id: cue_ranking
  parameter: Cue ranking
  role: L_e
  value: 200 permutations; 2,000 bootstrap resamples; largest positive L_e
  fixed_before: Stimulus generation
  status: suggested
- id: dose
  parameter: Dose
  role: Contrast width
  value: +/- 0.5 * IQR_e of within-clip segment values
  fixed_before: Stimulus generation
  status: suggested
- id: fidelity_thresholds
  parameter: Fidelity thresholds
  role: Stimulus acceptance
  value: Table A4.2
  fixed_before: Stimulus screening
  status: suggested
- id: pilot_gate
  parameter: Pilot gate
  role: Recipe
  value: At least 16 of 20 pilot clips pass
  fixed_before: Stimulus screening
  status: suggested
- id: design
  parameter: Design
  role: M, J, participants
  value: 48, 8, 360
  fixed_before: Preregistration
  status: suggested
- id: primary_model
  parameter: Primary model
  role: Confirmatory test
  value: Maximal mixed model; fixed simplification order; two-sided alpha = .05
  fixed_before: Data collection
  status: suggested
- id: heterogeneity_bound
  parameter: Heterogeneity bound
  role: δ
  value: 0.20 SD of Y
  fixed_before: Preregistration
  status: suggested
- id: multiplicity
  parameter: Multiplicity
  role: Step 5 contrasts
  value: Holm; Benjamini–Hochberg as sensitivity
  fixed_before: Preregistration
  status: suggested
- id: registry
  parameter: Registry
  role: Preregistration
  value: AsPredicted; full plan archived with a persistent identifier
  fixed_before: Data collection
  status: suggested
- id: master_seed
  parameter: Master seed
  role: Randomness
  value: 20261101 combined with script name
  fixed_before: Any run
  status: suggested
machine:
  master_seed: 20261101
  evaluation:
    untouched_share: 0.2
    stratify_on: T_quintile
    outer_folds: 5
    inner_validation_share: 0.2
    pilot_mode_S_sizes:
      train: 609
      val: 204
      test: 203
  gmfn_search:
    n_configs: 30
    patience: 10
    max_epochs: 100
    n_training_seeds_min: 5
  validity_gate:
    r_over_rmax_min: 0.5
    delta_r2_lower_bound_gt: 0.0
    bootstrap_resamples: 2000
    ci_level: 0.95
  discriminant_margin: 0.1
