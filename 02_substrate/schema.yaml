# Data interface for the three modality streams and labels (appendix A1, A2.1).
# Any corpus that follows this layout can be run through 03_measure without code changes.
# No real data are included in this release.
clips:
  id: string, random identifier (no names, no source mapping)
modalities:
  L: {source: bert-base-uncased sentence-level features, dim: 768, per_step: true}
  A: {source: acoustic features (COVAREP in the pilot), dim: 74, per_step: true}
  V: {source: facial features (OpenFace in the pilot), dim: 35, per_step: true}
sequence:
  steps: 624              # padded / truncated length in the pilot configuration
  array_layout: [clips, steps, dim]
  standardize: training data only (mean and sd from the training set or training folds)
labels:
  T: mean of k annotator ratings, 1-7
  raters: [clips, k]      # annotator-level ratings, needed for ICC(2,k)
  rivals: [authenticity, competence, warmth, charisma, confidence]   # same scale, planned
files:
  format: pickle in the pilot (arrays text, audio, vision, labels, plus an info list); npz or parquet are equivalent
